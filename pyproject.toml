[tool.ruff]
exclude = ["legacy/"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
	"integration: end-to-end integration tests requiring a live LLM service",
]
