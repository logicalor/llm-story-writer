[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-story-writer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
	"aiohttp>=3.9.0",
	"httpx>=0.25.0",
	"openai>=1.0",
	"pyyaml>=6.0.0",
	"requests>=2.31.0",
	"chromadb>=0.5.0",
	"llm-output-parser>=0.3.0",
	"textual>=6.0,<7.0",
]

[project.scripts]
story-writer = "presentation.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = [
	"integration: end-to-end integration tests requiring a live LLM service",
	"slow: marks tests as slow (may take multiple minutes)",
]
