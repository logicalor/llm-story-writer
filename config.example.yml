  #scene_writer: "openai-compat://hf.co/DavidAU/L3-DARKEST-PLANET-16.5B-GGUF"

# Generation Settings
generation:
  seed: 12
  wanted_chapters: 30
  enable_final_edit: false
  enable_scrubbing: true
  expand_outline: true
  scene_generation_pipeline: true
  scenes_per_chapter_min: 8
  scenes_per_chapter_max: 16
  enable_outline_critique: true
  enable_scene_critique: true
  enable_decomposition_critique: true
  scene_critique_score_threshold: 80.0
  scene_critique_max_iterations: 3
  # Threshold mode: "fixed" applies threshold uniformly; "adaptive" starts
  # permissive for early chapters and tightens as wiki style notes accumulate.
  scene_critique_threshold_mode: "fixed"
  # Slack subtracted from threshold at chapter 1 in adaptive mode.
  scene_critique_adaptive_slack: 10.0
  # scene_critique_critics:     # Uncomment and extend for ensemble mode
  #   - "scene-default"         # Default: single implicit critic (current behaviour)
  #   - "commercial-fiction-editor"
  #   - "literary-fiction-reviewer"
  enable_beat_sheet: true
  enable_living_scene_plan: true
  stream: true
  debug: true
  use_improved_recap_sanitizer: true
  use_multi_stage_recap_sanitizer: true
  use_chunked_outline_generation: true
  outline_chunk_size: 5
  log_prompt_inputs: true
  # Author persona system
  enable_author_persona: true       # master kill switch for persona injection
  persona_model: null               # overrides creative_model for persona generation; null = use creative_model
  persona_word_budget: 225          # target word count for persona document; valid range: 100–500
  enable_emphasis_delta: true       # per-chapter tonal delta alongside the static persona

# Translation Settings
translation:
  translate_language: null
  translate_prompt_language: null

# Infrastructure Settings
infrastructure:
  output_dir: "/home/shaun/Documents/stories/output"
  savepoint_dir: "/home/shaun/Documents/stories/saves"
  logs_dir: "Logs"
  model_api_base: "http://127.0.0.1:1234/v1"
  context_length: 16384
  randomize_seed: true
  
  # RAG Configuration
  embedding_model: "openai-compat://nomic-embed-text"
  vector_dimensions: 1536
  similarity_threshold: 0.7
  max_context_chunks: 20
  max_chunk_size: 1000
  overlap_size: 200
